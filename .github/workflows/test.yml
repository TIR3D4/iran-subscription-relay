name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
      - name: PHP lint
        run: find src examples tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Routing tests
        run: php tests/relay-test.php
      - name: HTTP integration tests
        run: python3 tests/http-test.py
