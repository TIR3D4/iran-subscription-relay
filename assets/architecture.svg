<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">SubRelay architecture</title><desc id="desc">Subscription client requests the Iran relay. In dual mode Marzban is first and PasarGuard is tried only after 404. VPN connections go directly from the client to VPN servers.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071626"/><stop offset="1" stop-color="#102b3c"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#63e5c3"/></marker></defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)"/>
<g font-family="Arial,sans-serif" fill="#e6f5fa"><text x="60" y="65" font-size="32" font-weight="bold">SubRelay / Architecture</text><text x="60" y="101" fill="#9ebccc" font-size="18">Subscription retrieval via Iran · VPN connections go directly to configured servers</text></g>
<g fill="#132e43" stroke="#37586d" stroke-width="2"><rect x="55" y="205" width="220" height="130" rx="18"/><rect x="370" y="205" width="245" height="130" rx="18"/><rect x="825" y="180" width="275" height="100" rx="18"/><rect x="825" y="355" width="275" height="100" rx="18"/><rect x="370" y="520" width="300" height="100" rx="18"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#e6f5fa" font-size="24" font-weight="bold"><text x="165" y="252">Client</text><text x="493" y="252">Iran host</text><text x="963" y="222">Marzban</text><text x="963" y="397">PasarGuard</text><text x="520" y="560">VPN servers</text></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#a9c9d8" font-size="17"><text x="165" y="286">Browser / VPN app</text><text x="493" y="286">PHP + cURL relay</text><text x="963" y="252">First upstream in dual mode</text><text x="963" y="427">Second upstream in dual mode</text><text x="520" y="591">Addresses from configs</text></g>
<g fill="none" stroke="#63e5c3" stroke-width="3" marker-end="url(#arrow)"><path d="M275 245H370"/><path d="M615 230H825"/><path d="M963 280V355"/><path d="M825 405H750V310H615"/></g>
<g fill="none" stroke="#6aaaf4" stroke-width="3"><path d="M370 315H275"/><path d="M165 335V570H370" stroke-dasharray="8 8"/></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#63e5c3"><text x="289" y="225">/sub/TOKEN</text><text x="650" y="212">HTTPS request</text><text x="985" y="322">404 only</text><text x="649" y="440">Response</text></g><g font-family="Arial,sans-serif" font-size="16" fill="#8cbcf8"><text x="282" y="348">Subscription</text><text x="80" y="485">Direct VPN</text></g>
<text x="60" y="651" fill="#9ebccc" font-family="Arial,sans-serif" font-size="16">Timeout / TLS / server errors do not trigger fallback. No VPN data passes through the relay.</text></svg>
